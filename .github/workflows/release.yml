name: Build and Upload Release DMG

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Lyra.app and Lyra.dmg
        run: |
          chmod +x Scripts/package.sh Scripts/create_dmg.sh
          bash Scripts/create_dmg.sh

      - name: Upload Lyra.dmg Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: dist/Lyra.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
